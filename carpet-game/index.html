<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Чистим Ковры</title>
    <script src="phaser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%;
            height: 100%;
            background: #1a1a1a; 
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: Arial, sans-serif;
        }
        canvas { 
            display: block; 
            touch-action: none;
        }
    </style>
</head>
<body>

<script>
// ============================================
// ⚙️ НАСТРОЙКИ
// ============================================
const CONFIG = {
    startMoney: 0,
    startFood: 3,
    startToolLevel: 1,
    
    foodPrice: 10,
    toolBasePrice: 50,
    
    rewardMin: 50,
    rewardMax: 100,
    
    // Сложность чистки
    brushRadius: 25,
    eraseStrength: 0.15,
    finishThreshold: 0.95,
    
    toolRadiusBonus: 0.15,
    toolStrengthBonus: 0.2
};

// ============================================
// 🖼️ КАРТИНКИ — ПОДСТАВЬ СВОИ ПУТИ
// ============================================
const IMAGES = {
    carpet: null,      // ← 'carpet.png'
    dirt: null,        // ← 'dirt.png'
};

// ============================================
// СОСТОЯНИЕ
// ============================================
const GameState = {
    money: CONFIG.startMoney,
    food: CONFIG.startFood,
    toolLevel: CONFIG.startToolLevel
};

let ysdk = null;

// ============================================
// YANDEX SDK
// ============================================
async function initYandexSDK() {
    try {
        if (typeof YaGames === 'undefined') {
            throw new Error('YaGames не определён');
        }
        ysdk = await YaGames.init();
        console.log('✅ Yandex SDK загружен');
        
        const stats = await ysdk.player.getStats(['money', 'food', 'toolLevel']);
        if (stats.money !== undefined) GameState.money = Number(stats.money) || 0;
        if (stats.food !== undefined) GameState.food = Number(stats.food) || 3;
        if (stats.toolLevel !== undefined) GameState.toolLevel = Number(stats.toolLevel) || 1;
    } catch (e) {
        console.log('⚠️ SDK не загружен. Заглушка.');
        ysdk = {
            player: {
                getStats: async () => {
                    const saved = localStorage.getItem('carpetGameStats');
                    return saved ? JSON.parse(saved) : {};
                },
                setStats: async (stats) => {
                    localStorage.setItem('carpetGameStats', JSON.stringify(stats));
                }
            },
            adv: {
                showRewardedVideo: (opts) => {
                    if (opts?.callbacks?.onRewarded) opts.callbacks.onRewarded();
                    if (opts?.callbacks?.onClose) opts.callbacks.onClose();
                },
                showFullscreenAdv: (opts) => {
                    if (opts?.callbacks?.onClose) opts.callbacks.onClose();
                }
            },
            features: {
                LoadingAPI: { ready: () => {} }
            }
        };
        
        const saved = localStorage.getItem('carpetGameStats');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                if (data.money !== undefined) GameState.money = Number(data.money) || 0;
                if (data.food !== undefined) GameState.food = Number(data.food) || 3;
                if (data.toolLevel !== undefined) GameState.toolLevel = Number(data.toolLevel) || 1;
            } catch (err) {}
        }
    }
}

async function saveGame() {
    if (!ysdk) return;
    try {
        await ysdk.player.setStats({
            money: GameState.money,
            food: GameState.food,
            toolLevel: GameState.toolLevel
        });
    } catch (e) {
        console.error('Ошибка сохранения:', e);
    }
}

// ============================================
// СЦЕНА ЗАГРУЗКИ
// ============================================
class PreloadScene extends Phaser.Scene {
    constructor() {
        super('PreloadScene');
    }

    preload() {
        if (IMAGES.carpet) this.load.image('carpet', IMAGES.carpet);
        if (IMAGES.dirt) this.load.image('dirt', IMAGES.dirt);
        
        const w = this.cameras.main.width;
        const h = this.cameras.main.height;
        
        this.add.text(w/2, h/2 - 50, 'Загрузка...', {
            fontSize: '40px', fill: '#FFFFFF', fontFamily: 'Arial'
        }).setOrigin(0.5);
        
        this.add.rectangle(w/2, h/2 + 30, 400, 30, 0x333333);
        const bar = this.add.rectangle(w/2 - 200, h/2 + 30, 0, 26, 0x00FF00).setOrigin(0, 0.5);
        
        this.load.on('progress', (value) => {
            bar.width = 400 * value;
        });
    }

    create() {
        initYandexSDK();
        this.scene.start('MainScene');
    }
}

// ============================================
// ОСНОВНАЯ СЦЕНА
// ============================================
class MainScene extends Phaser.Scene {
    constructor() {
        super('MainScene');
    }

    create() {
        if (this.input.mouse) {
            this.input.mouse.disableContextMenu();
        }
        
        if (ysdk?.features?.LoadingAPI) {
            ysdk.features.LoadingAPI.ready();
        }
        
        const W = 720;
        const H = 1280;
        
        this.add.rectangle(W/2, H/2, W, H, 0x2a2a2a);
        
        this.carpetW = 500;
        this.carpetH = 700;
        this.carpetX = W/2;
        this.carpetY = 700;
        
        // Чистый ковёр
        if (this.textures.exists('carpet')) {
            this.carpetImg = this.add.image(this.carpetX, this.carpetY, 'carpet');
            this.carpetImg.setDisplaySize(this.carpetW, this.carpetH);
        } else {
            this.carpetImg = this.add.rectangle(
                this.carpetX, this.carpetY, 
                this.carpetW, this.carpetH, 0x8B4513
            );
            this.carpetImg.setStrokeStyle(4, 0x654321);
        }
        
        // Сетка плотности грязи
        this.dirtRT = this.make.renderTexture({
            width: this.carpetW,
            height: this.carpetH,
            x: this.carpetX,
            y: this.carpetY
        }, false);
        
        this.gridCellSize = 10;
        this.gridCols = Math.ceil(this.carpetW / this.gridCellSize);
        this.gridRows = Math.ceil(this.carpetH / this.gridCellSize);
        this.dirtGrid = [];
        
        for (let y = 0; y < this.gridRows; y++) {
            this.dirtGrid[y] = [];
            for (let x = 0; x < this.gridCols; x++) {
                this.dirtGrid[y][x] = 1.0;
            }
        }
        
        this.drawDirt();
        
        this.carpetBounds = new Phaser.Geom.Rectangle(
            this.carpetX - this.carpetW/2, 
            this.carpetY - this.carpetH/2, 
            this.carpetW, 
            this.carpetH
        );
        
        this.cleanProgress = 0;
        this.isPointerDown = false;
        
        // Кисть
        this.brush = this.add.circle(0, 0, CONFIG.brushRadius, 0xFFFFFF, 0.15);
        this.brush.setVisible(false);
        
        // UI
        this.moneyText = this.add.text(30, 30, '💰 ' + GameState.money, {
            fontSize: '36px', fill: '#FFD700', fontStyle: 'bold', fontFamily: 'Arial'
        });
        
        this.foodText = this.add.text(30, 80, '🍞 ' + GameState.food, {
            fontSize: '28px', fill: '#FFFFFF', fontFamily: 'Arial'
        });
        
        this.toolText = this.add.text(30, 120, '🧹 Ур. ' + GameState.toolLevel, {
            fontSize: '24px', fill: '#AAAAAA', fontFamily: 'Arial'
        });
        
        this.add.rectangle(W/2, 200, 400, 30, 0x333333);
        this.progressBar = this.add.rectangle(W/2 - 200, 200, 0, 26, 0x00FF00).setOrigin(0, 0.5);
        this.progressText = this.add.text(W/2, 200, '0%', {
            fontSize: '22px', fill: '#FFFFFF', fontFamily: 'Arial'
        }).setOrigin(0.5);
        
        this.add.text(640, 40, '🛒', { fontSize: '48px' })
            .setInteractive({ useHandCursor: true })
            .on('pointerdown', () => this.openShop());
        
        this.add.text(W/2, 1150, 'ПОЛУЧИТЬ ДЕНЬГИ', {
            fontSize: '32px', fill: '#00FF00', fontStyle: 'bold',
            backgroundColor: '#000000', padding: { x: 20, y: 10 },
            fontFamily: 'Arial'
        }).setOrigin(0.5)
          .setInteractive({ useHandCursor: true })
          .on('pointerdown', () => this.finishCarpet());
        
        this.setupCleaning();
        
        if (GameState.food <= 0) {
            this.showMessage('Нет еды! Купи еду в магазине.');
        }
    }

    drawDirt() {
        this.dirtRT.clear();
        
        if (this.textures.exists('dirt')) {
            this.dirtRT.draw('dirt', 0, 0);
        } else {
            const g = this.make.graphics({ x: 0, y: 0, add: false });
            
            for (let y = 0; y < this.gridRows; y++) {
                for (let x = 0; x < this.gridCols; x++) {
                    const density = this.dirtGrid[y][x];
                    if (density <= 0.05) continue;
                    
                    g.fillStyle(0x3a2a1a, density * 0.95);
                    g.fillRect(
                        x * this.gridCellSize, 
                        y * this.gridCellSize, 
                        this.gridCellSize, 
                        this.gridCellSize
                    );
                }
            }
            
            this.dirtRT.draw(g);
            g.destroy();
        }
        
        this.dirtRT.render();
    }

    // ============================================
    // ТАЧ + МЫШЬ
    // ============================================
    setupCleaning() {
        // Отключаем контекстное меню и системные жесты
        this.game.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        this.game.canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
        
        const handlePointer = (pointer) => {
            this.brush.setPosition(pointer.x, pointer.y);
            this.brush.setVisible(
                GameState.food > 0 &&
                Phaser.Geom.Rectangle.Contains(this.carpetBounds, pointer.x, pointer.y)
            );
            
            if (GameState.food <= 0) return;
            if (!Phaser.Geom.Rectangle.Contains(this.carpetBounds, pointer.x, pointer.y)) return;
            
            this.eraseAt(pointer.x, pointer.y);
        };
        
        this.input.on('pointerdown', (pointer) => {
            this.isPointerDown = true;
            handlePointer(pointer);
        });
        
        this.input.on('pointermove', (pointer) => {
            if (!this.isPointerDown && !pointer.isDown) return;
            handlePointer(pointer);
        });
        
        this.input.on('pointerup', () => {
            this.isPointerDown = false;
            this.brush.setVisible(false);
        });
        
        this.input.on('pointerout', () => {
            this.isPointerDown = false;
            this.brush.setVisible(false);
        });
    }

    eraseAt(screenX, screenY) {
        const localX = screenX - (this.carpetX - this.carpetW/2);
        const localY = screenY - (this.carpetY - this.carpetH/2);
        
        const radius = CONFIG.brushRadius * (1 + (GameState.toolLevel - 1) * CONFIG.toolRadiusBonus);
        const strength = CONFIG.eraseStrength * (1 + (GameState.toolLevel - 1) * CONFIG.toolStrengthBonus);
        
        const cellSize = this.gridCellSize;
        const minCol = Math.max(0, Math.floor((localX - radius) / cellSize));
        const maxCol = Math.min(this.gridCols - 1, Math.floor((localX + radius) / cellSize));
        const minRow = Math.max(0, Math.floor((localY - radius) / cellSize));
        const maxRow = Math.min(this.gridRows - 1, Math.floor((localY + radius) / cellSize));
        
        let changed = false;
        
        for (let row = minRow; row <= maxRow; row++) {
            for (let col = minCol; col <= maxCol; col++) {
                const cellCenterX = col * cellSize + cellSize / 2;
                const cellCenterY = row * cellSize + cellSize / 2;
                
                const dx = cellCenterX - localX;
                const dy = cellCenterY - localY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > radius) continue;
                
                const falloff = 1 - (dist / radius);
                const eraseAmount = strength * falloff;
                
                const before = this.dirtGrid[row][col];
                this.dirtGrid[row][col] = Math.max(0, before - eraseAmount);
                
                if (this.dirtGrid[row][col] !== before) {
                    changed = true;
                }
            }
        }
        
        if (changed) {
            this.drawDirt();
            this.recalcProgress();
        }
    }

    recalcProgress() {
        let total = 0;
        const cells = this.gridCols * this.gridRows;
        
        for (let y = 0; y < this.gridRows; y++) {
            for (let x = 0; x < this.gridCols; x++) {
                total += (1 - this.dirtGrid[y][x]);
            }
        }
        
        this.cleanProgress = total / cells;
        this.updateProgressBar();
    }

    updateProgressBar() {
        const percent = Math.min(100, Math.floor(this.cleanProgress * 100));
        this.progressBar.width = 400 * this.cleanProgress;
        this.progressText.setText(percent + '%');
    }

    async finishCarpet() {
        if (this.cleanProgress < CONFIG.finishThreshold) {
            this.showMessage('Ковёр ещё грязный!');
            return;
        }
        
        const reward = Math.floor(
            CONFIG.rewardMin + Math.random() * (CONFIG.rewardMax - CONFIG.rewardMin)
        ) * GameState.toolLevel;
        
        GameState.money += reward;
        GameState.food -= 1;
        
        this.moneyText.setText('💰 ' + GameState.money);
        this.foodText.setText('🍞 ' + GameState.food);
        
        await saveGame();
        
        this.showMessage(`+${reward} 💰! Еда: -1`);
        
        for (let y = 0; y < this.gridRows; y++) {
            for (let x = 0; x < this.gridCols; x++) {
                this.dirtGrid[y][x] = 1.0;
            }
        }
        this.drawDirt();
        this.cleanProgress = 0;
        this.updateProgressBar();
    }

    openShop() {
        const W = 720;
        const H = 1280;
        const elements = [];
        
        const overlay = this.add.rectangle(W/2, H/2, W, H, 0x000000, 0.85);
        overlay.setInteractive();
        elements.push(overlay);
        
        const bg = this.add.rectangle(W/2, H/2, 600, 800, 0x333333);
        bg.setStrokeStyle(4, 0xFFD700);
        elements.push(bg);
        
        elements.push(this.add.text(W/2, 280, 'МАГАЗИН', {
            fontSize: '48px', fill: '#FFD700', fontStyle: 'bold', fontFamily: 'Arial'
        }).setOrigin(0.5));
        
        const foodBtn = this.add.text(W/2, 450, 
            `Купить еду (${CONFIG.foodPrice}💰)\n🍞 +1`, {
            fontSize: '32px', fill: '#FFFFFF', align: 'center',
            backgroundColor: '#444444', padding: { x: 30, y: 15 },
            fontFamily: 'Arial'
        }).setOrigin(0.5)
          .setInteractive({ useHandCursor: true })
          .on('pointerdown', async () => {
            if (GameState.money >= CONFIG.foodPrice) {
                GameState.money -= CONFIG.foodPrice;
                GameState.food += 1;
                this.moneyText.setText('💰 ' + GameState.money);
                this.foodText.setText('🍞 ' + GameState.food);
                await saveGame();
                this.showMessage('Куплена еда!');
            } else {
                this.showMessage('Не хватает денег!');
            }
        });
        elements.push(foodBtn);
        
        const toolCost = GameState.toolLevel * CONFIG.toolBasePrice;
        const toolBtn = this.add.text(W/2, 620, 
            `Улучшить щётку (${toolCost}💰)\nУр. ${GameState.toolLevel} → ${GameState.toolLevel + 1}`, {
            fontSize: '28px', fill: '#FFFFFF', align: 'center',
            backgroundColor: '#444444', padding: { x: 30, y: 15 },
            fontFamily: 'Arial'
        }).setOrigin(0.5)
          .setInteractive({ useHandCursor: true })
          .on('pointerdown', async () => {
            const cost = GameState.toolLevel * CONFIG.toolBasePrice;
            if (GameState.money >= cost) {
                GameState.money -= cost;
                GameState.toolLevel += 1;
                this.moneyText.setText('💰 ' + GameState.money);
                this.toolText.setText('🧹 Ур. ' + GameState.toolLevel);
                await saveGame();
                this.showMessage('Щётка улучшена!');
                const newCost = GameState.toolLevel * CONFIG.toolBasePrice;
                toolBtn.setText(
                    `Улучшить щётку (${newCost}💰)\nУр. ${GameState.toolLevel} → ${GameState.toolLevel + 1}`
                );
            } else {
                this.showMessage('Не хватает денег!');
            }
        });
        elements.push(toolBtn);
        
        const closeBtn = this.add.text(620, 280, '✖', {
            fontSize: '48px', fill: '#FF4444', fontFamily: 'Arial'
        }).setOrigin(0.5)
          .setInteractive({ useHandCursor: true })
          .on('pointerdown', () => {
            elements.forEach(el => el.destroy());
        });
        elements.push(closeBtn);
    }

    showMessage(text) {
        const msg = this.add.text(360, 1000, text, {
            fontSize: '32px', fill: '#FFFF00', fontStyle: 'bold',
            backgroundColor: '#000000', padding: { x: 20, y: 10 },
            fontFamily: 'Arial'
        }).setOrigin(0.5);
        
        this.time.delayedCall(1500, () => msg.destroy());
    }
}

// ============================================
// ЗАПУСК
// ============================================
const phaserConfig = {
    type: Phaser.CANVAS,
    width: 720,
    height: 1280,
    backgroundColor: '#1a1a1a',
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    input: {
        activePointers: 3,
        touch: {
            capture: true
        }
    },
    scene: [PreloadScene, MainScene]
};

window.addEventListener('load', () => {
    new Phaser.Game(phaserConfig);
});
</script>

</body>
</html>
